<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/owner-css/owner-profile.css">
    <title>الملف الشخصي - بيتي</title>
   
<base target="_blank">
</head>
<body>

    <button class="sidebar-toggle" onclick="toggleSidebar()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">بيتي <span>BAYATY</span></div>

        <a href="owner-profile.html" class="user-profile" id="userProfile">
            <div class="user-avatar" id="userAvatar">م</div>
            <div class="user-info">
                <span class="user-name" id="userName">مالك العقار</span>
                <span class="user-role">الملف الشخصي</span>
            </div>
        </a>

        <a href="add-property.html" class="sidebar-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            إضافة عقار جديد
        </a>

        <a href="owner-buld.html" class="sidebar-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            عقاراتي
        </a>

        <a href="owner-mony.html" class="sidebar-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            المدفوعات
        </a>

        <a href="owner-support.html" class="sidebar-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
            الدعم
        </a>

        <div class="sidebar-bottom">
            <div class="sidebar-divider"></div>
            <a href="home.html" class="sidebar-btn" onclick="logout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                تسجيل الخروج
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1>الملف <span>الشخصي</span></h1>
            <p>عرض بياناتك الشخصية — للتعديل يلزم موافقة الإدارة</p>
        </div>

        <div class="profile-card">
            <div class="profile-avatar" id="profileAvatar">م</div>
            <div class="profile-name" id="profileName">مالك العقار</div>
            <div class="profile-role" id="profileRole">
                <span class="badge badge-owner" id="typeBadge">🏠 صاحب سكن</span>
                <span class="badge badge-banned" id="statusBadge" style="display:none;">🚫 محظور</span>
                <span class="badge" id="editStatusBadge" style="display:none; background:#f59e0b; color:#fff; margin-right:6px;"></span>
            </div>
            <div class="profile-stats">
                <div class="profile-stat">
                    <div class="profile-stat-number" id="statProperties">0</div>
                    <div class="profile-stat-label">عقارات</div>
                </div>
                <div class="profile-stat">
                    <div class="profile-stat-number" id="statPublished">0</div>
                    <div class="profile-stat-label">منشور</div>
                </div>
                <div class="profile-stat">
                    <div class="profile-stat-number" id="statPending">0</div>
                    <div class="profile-stat-label">قيد المراجعة</div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="section-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <div class="icon-circle">👤</div>
                    البيانات الشخصية
                </div>
                <button id="editBtn" onclick="toggleEdit()" class="sidebar-btn" style="width:auto; padding:8px 16px; font-size:0.85rem;">
                    ✏️ تعديل البيانات
                </button>
            </div>
            <div class="info-grid" id="infoGrid">
            </div>
        </div>

        <div class="form-section">
            <div class="section-header">
                <div class="icon-circle">📎</div>
                المستندات المرفقة
            </div>
            <div class="info-grid" id="docsGrid">
            </div>
        </div>
    </main>

    <div class="img-modal-overlay" id="imgModal" onclick="closeImgModal(event)">
        <div class="img-modal-box" onclick="event.stopPropagation()">
            <button class="img-modal-close" onclick="closeImgModal()">✕</button>
            <img id="imgModalSrc" src="" alt="">
            <div class="img-modal-title" id="imgModalTitle">مستند المستخدم</div>
        </div>
    </div>
<script src="../js/owner-js/profile-owner.js"></script>
   
</body>
</html>
